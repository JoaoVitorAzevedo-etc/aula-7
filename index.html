<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tigre.css">
</head>
<body>
    <h1>Bem-vindo ao Jogo do Tigrinho!</h1>
    <p>Você começa com R$1000,00.</p>
    <p>Tente acertar o número entre 1 e 10. Se acertar, o seu saldo dobra! Se errar 3 vezes, perde tudo!</p>

    <h2 id="saldo">Saldo: R$1000,00</h2>

    <div id="game">
        <input type="number" id="guess" min="1" max="10" placeholder="Escolha um número (1 a 10)">
        <button class="button" onclick="adivinhar()">Tentar</button>
    </div>

    <div id="result" class="result"></div>
    <script src="tigre.js"></script>
</body>
</html>
